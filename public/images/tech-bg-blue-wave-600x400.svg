<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bg-gradient)" />
  
  <!-- 波浪元素 -->
  <path d="M0,250 C100,200 200,300 300,250 C400,200 500,300 600,250 L600,400 L0,400 Z" fill="rgba(56, 189, 248, 0.2)" />
  <path d="M0,300 C100,250 200,350 300,300 C400,250 500,350 600,300 L600,400 L0,400 Z" fill="rgba(56, 189, 248, 0.1)" />
  
  <!-- 几何元素 -->
  <g opacity="0.7" filter="url(#glow)">
    <circle cx="150" cy="100" r="50" fill="none" stroke="#7dd3fc" stroke-width="1.5" />
    <circle cx="450" cy="300" r="70" fill="none" stroke="#7dd3fc" stroke-width="1.5" />
    
    <line x1="150" y1="100" x2="450" y2="300" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6,6" />
    
    <!-- 科技节点 -->
    <circle cx="150" cy="100" r="4" fill="#06b6d4" />
    <circle cx="300" cy="200" r="4" fill="#06b6d4" />
    <circle cx="450" cy="300" r="4" fill="#06b6d4" />
  </g>
  
  <!-- 科技图标 -->
  <g transform="translate(300, 200)" filter="url(#glow)">
    <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#22d3ee" stroke-width="2" rx="10" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="#0891b2" stroke-width="1" />
    
    <!-- 雷达线 -->
    <line x1="12" y1="0" x2="25" y2="0" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="-12" y1="0" x2="-25" y2="0" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="0" y1="12" x2="0" y2="25" stroke="#22d3ee" stroke-width="1.5" />
    <line x1="0" y1="-12" x2="0" y2="-25" stroke="#22d3ee" stroke-width="1.5" />
  </g>
</svg>