<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="80" fill="url(#bg-gradient)" rx="4" ry="4" />
  
  <!-- 科技线条 -->
  <path d="M20,40 H180" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M60,20 L60,60" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M100,20 L100,60" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M140,20 L140,60" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  
  <!-- 科技节点 -->
  <circle cx="20" cy="40" r="4" fill="#38bdf8" />
  <circle cx="60" cy="40" r="4" fill="#22d3ee" />
  <circle cx="100" cy="40" r="4" fill="#22d3ee" />
  <circle cx="140" cy="40" r="4" fill="#22d3ee" />
  <circle cx="180" cy="40" r="4" fill="#38bdf8" />
</svg>