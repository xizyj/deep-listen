<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bg-gradient)" />
  
  <!-- 网格线 -->
  <g opacity="0.1">
    <path d="M0,0 H600" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,50 H600" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,100 H600" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,150 H600" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,200 H600" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,250 H600" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,300 H600" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,350 H600" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,400 H600" stroke="#94a3b8" stroke-width="1" />
    
    <path d="M0,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M50,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M100,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M150,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M200,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M250,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M300,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M350,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M400,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M450,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M500,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M550,0 V400" stroke="#94a3b8" stroke-width="1" />
    <path d="M600,0 V400" stroke="#94a3b8" stroke-width="1" />
  </g>
  
  <!-- 科技感元素 -->
  <circle cx="300" cy="200" r="100" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" filter="url(#glow)" />
  <circle cx="300" cy="200" r="80" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" />
  
  <!-- 科技图标 -->
  <g transform="translate(250, 150)" filter="url(#glow)">
    <rect x="-30" y="-30" width="60" height="60" fill="none" stroke="#38bdf8" stroke-width="2" rx="5" />
    <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#22d3ee" stroke-width="1.5" rx="3" />
    <path d="M-10,-10 L10,10 M-10,10 L10,-10" stroke="#06b6d4" stroke-width="2" />
  </g>
</svg>