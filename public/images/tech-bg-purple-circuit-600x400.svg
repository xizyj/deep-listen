<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b69" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bg-gradient)" />
  
  <!-- 电路图案 -->
  <g stroke="#a78bfa" stroke-width="1" opacity="0.3">
    <!-- 主电路线 -->
    <path d="M50,50 H550" stroke-width="1.5" />
    <path d="M50,350 H550" stroke-width="1.5" />
    <path d="M50,50 V350" stroke-width="1.5" />
    <path d="M550,50 V350" stroke-width="1.5" />
    
    <!-- 交叉电路 -->
    <path d="M150,150 H450" />
    <path d="M250,250 H350" />
    <path d="M150,150 V250" />
    <path d="M250,150 V350" />
    <path d="M350,50 V350" />
    <path d="M450,150 V350" />
    
    <!-- 节点 -->
    <circle cx="150" cy="150" r="3" fill="#c4b5fd" />
    <circle cx="250" cy="150" r="3" fill="#c4b5fd" />
    <circle cx="350" cy="150" r="3" fill="#c4b5fd" />
    <circle cx="450" cy="150" r="3" fill="#c4b5fd" />
    
    <circle cx="150" cy="250" r="3" fill="#c4b5fd" />
    <circle cx="250" cy="250" r="3" fill="#c4b5fd" />
    <circle cx="350" cy="250" r="3" fill="#c4b5fd" />
    <circle cx="450" cy="250" r="3" fill="#c4b5fd" />
    
    <circle cx="150" cy="350" r="3" fill="#c4b5fd" />
    <circle cx="250" cy="350" r="3" fill="#c4b5fd" />
    <circle cx="350" cy="350" r="3" fill="#c4b5fd" />
    <circle cx="450" cy="350" r="3" fill="#c4b5fd" />
  </g>
  
  <!-- 中央科技元素 -->
  <g transform="translate(300, 200)" filter="url(#glow)">
    <rect x="-80" y="-80" width="160" height="160" fill="none" stroke="#c084fc" stroke-width="2" rx="15" />
    
    <!-- 电路板图案 -->
    <path d="M-60,-60 H60" stroke="#e9d5ff" stroke-width="1.5" />
    <path d="M-60,-30 H60" stroke="#e9d5ff" stroke-width="1.5" />
    <path d="M-60,0 H60" stroke="#e9d5ff" stroke-width="1.5" />
    <path d="M-60,30 H60" stroke="#e9d5ff" stroke-width="1.5" />
    <path d="M-60,60 H60" stroke="#e9d5ff" stroke-width="1.5" />
    
    <path d="M-60,-60 V60" stroke="#e9d5ff" stroke-width="1.5" />
    <path d="M-30,-60 V60" stroke="#e9d5ff" stroke-width="1.5" />
    <path d="M0,-60 V60" stroke="#e9d5ff" stroke-width="1.5" />
    <path d="M30,-60 V60" stroke="#e9d5ff" stroke-width="1.5" />
    <path d="M60,-60 V60" stroke="#e9d5ff" stroke-width="1.5" />
    
    <!-- 中心芯片 -->
    <circle cx="0" cy="0" r="20" fill="#7e22ce" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="0" cy="0" r="12" fill="#6d28d9" stroke="#c4b5fd" stroke-width="1" />
  </g>
</svg>