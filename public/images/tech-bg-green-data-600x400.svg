<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bg-gradient)" />
  
  <!-- 数据流动效果 -->
  <g opacity="0.6">
    <!-- 数据流1 -->
    <g transform="translate(50, 80)" filter="url(#glow)">
      <path d="M0,0 L0,100 L100,100 L100,200 L200,200 L200,280" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-dasharray="10,5" />
      <circle cx="0" cy="0" r="3" fill="#34d399" />
      <circle cx="0" cy="100" r="3" fill="#34d399" />
      <circle cx="100" cy="100" r="3" fill="#34d399" />
      <circle cx="100" cy="200" r="3" fill="#34d399" />
      <circle cx="200" cy="200" r="3" fill="#34d399" />
      <circle cx="200" cy="280" r="3" fill="#34d399" />
    </g>
    
    <!-- 数据流2 -->
    <g transform="translate(350, 40)" filter="url(#glow)">
      <path d="M0,0 L120,0 L120,80 L60,80 L60,160 L220,160 L220,240" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-dasharray="10,5" />
      <circle cx="0" cy="0" r="3" fill="#34d399" />
      <circle cx="120" cy="0" r="3" fill="#34d399" />
      <circle cx="120" cy="80" r="3" fill="#34d399" />
      <circle cx="60" cy="80" r="3" fill="#34d399" />
      <circle cx="60" cy="160" r="3" fill="#34d399" />
      <circle cx="220" cy="160" r="3" fill="#34d399" />
      <circle cx="220" cy="240" r="3" fill="#34d399" />
    </g>
  </g>
  
  <!-- 中央数据处理元素 -->
  <g transform="translate(300, 200)" filter="url(#glow)">
    <rect x="-80" y="-80" width="160" height="160" fill="none" stroke="#22c55e" stroke-width="2" rx="15" />
    
    <!-- 数据网格 -->
    <g stroke="#6ee7b7" stroke-width="1" opacity="0.5">
      <path d="M-60,-60 H60" />
      <path d="M-60,-30 H60" />
      <path d="M-60,0 H60" />
      <path d="M-60,30 H60" />
      <path d="M-60,60 H60" />
      
      <path d="M-60,-60 V60" />
      <path d="M-30,-60 V60" />
      <path d="M0,-60 V60" />
      <path d="M30,-60 V60" />
      <path d="M60,-60 V60" />
    </g>
    
    <!-- 数据处理符号 -->
    <g fill="#6ee7b7">
      <!-- 数据块 -->
      <rect x="-60" y="-60" width="120" height="20" rx="4" opacity="0.8" />
      <rect x="-60" y="-30" width="120" height="20" rx="4" opacity="0.8" />
      <rect x="-60" y="0" width="120" height="20" rx="4" opacity="0.8" />
      <rect x="-60" y="30" width="120" height="20" rx="4" opacity="0.8" />
      <rect x="-60" y="60" width="120" height="20" rx="4" opacity="0.8" />
    </g>
  </g>
</svg>