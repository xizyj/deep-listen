<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bg-gradient)" />
  
  <!-- 网格线 -->
  <g opacity="0.1">
    <path d="M0,0 H400" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,50 H400" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,100 H400" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,150 H400" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,200 H400" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,250 H400" stroke="#94a3b8" stroke-width="1" />
    <path d="M0,300 H400" stroke="#94a3b8" stroke-width="1" />
    
    <path d="M0,0 V300" stroke="#94a3b8" stroke-width="1" />
    <path d="M50,0 V300" stroke="#94a3b8" stroke-width="1" />
    <path d="M100,0 V300" stroke="#94a3b8" stroke-width="1" />
    <path d="M150,0 V300" stroke="#94a3b8" stroke-width="1" />
    <path d="M200,0 V300" stroke="#94a3b8" stroke-width="1" />
    <path d="M250,0 V300" stroke="#94a3b8" stroke-width="1" />
    <path d="M300,0 V300" stroke="#94a3b8" stroke-width="1" />
    <path d="M350,0 V300" stroke="#94a3b8" stroke-width="1" />
    <path d="M400,0 V300" stroke="#94a3b8" stroke-width="1" />
  </g>
  
  <!-- 科技感元素 -->
  <circle cx="200" cy="150" r="70" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" filter="url(#glow)" />
  <circle cx="200" cy="150" r="55" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5" />
  
  <!-- 科技图标 -->
  <g transform="translate(170, 120)" filter="url(#glow)">
    <rect x="-20" y="-20" width="40" height="40" fill="none" stroke="#38bdf8" stroke-width="1.5" rx="4" />
    <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#22d3ee" stroke-width="1" rx="2" />
    <path d="M-8,-8 L8,8 M-8,8 L8,-8" stroke="#06b6d4" stroke-width="1.5" />
  </g>
</svg>