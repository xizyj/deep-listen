<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bg-gradient)" />
  
  <!-- 波浪元素 -->
  <path d="M0,600 C300,500 600,700 900,600 C1200,500 1500,700 1920,600 L1920,1080 L0,1080 Z" fill="rgba(56, 189, 248, 0.2)" />
  <path d="M0,700 C300,600 600,800 900,700 C1200,600 1500,800 1920,700 L1920,1080 L0,1080 Z" fill="rgba(56, 189, 248, 0.1)" />
  
  <!-- 几何元素 -->
  <g opacity="0.7" filter="url(#glow)">
    <circle cx="400" cy="300" r="150" fill="none" stroke="#7dd3fc" stroke-width="2" />
    <circle cx="1500" cy="800" r="200" fill="none" stroke="#7dd3fc" stroke-width="2" />
    
    <line x1="400" y1="300" x2="1500" y2="800" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="10,10" />
    
    <!-- 科技节点 -->
    <circle cx="400" cy="300" r="5" fill="#06b6d4" />
    <circle cx="960" cy="550" r="5" fill="#06b6d4" />
    <circle cx="1500" cy="800" r="5" fill="#06b6d4" />
  </g>
  
  <!-- 科技图标 -->
  <g transform="translate(960, 540)" filter="url(#glow)">
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="#22d3ee" stroke-width="3" rx="15" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#06b6d4" stroke-width="2" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#0891b2" stroke-width="1" />
    
    <!-- 雷达线 -->
    <line x1="20" y1="0" x2="40" y2="0" stroke="#22d3ee" stroke-width="2" />
    <line x1="-20" y1="0" x2="-40" y2="0" stroke="#22d3ee" stroke-width="2" />
    <line x1="0" y1="20" x2="0" y2="40" stroke="#22d3ee" stroke-width="2" />
    <line x1="0" y1="-20" x2="0" y2="-40" stroke="#22d3ee" stroke-width="2" />
    
    <line x1="14" y1="14" x2="28" y2="28" stroke="#22d3ee" stroke-width="2" />
    <line x1="-14" y1="-14" x2="-28" y2="-28" stroke="#22d3ee" stroke-width="2" />
    <line x1="14" y1="-14" x2="28" y2="-28" stroke="#22d3ee" stroke-width="2" />
    <line x1="-14" y1="14" x2="-28" y2="28" stroke="#22d3ee" stroke-width="2" />
  </g>
</svg>