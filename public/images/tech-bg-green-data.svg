<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bg-gradient)" />
  
  <!-- 数据流动效果 -->
  <g opacity="0.6">
    <!-- 数据流1 -->
    <g transform="translate(200, 200)" filter="url(#glow)">
      <path d="M0,0 L0,300 L300,300 L300,600 L600,600 L600,800" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-dasharray="20,10" />
      <circle cx="0" cy="0" r="5" fill="#34d399" />
      <circle cx="0" cy="300" r="5" fill="#34d399" />
      <circle cx="300" cy="300" r="5" fill="#34d399" />
      <circle cx="300" cy="600" r="5" fill="#34d399" />
      <circle cx="600" cy="600" r="5" fill="#34d399" />
      <circle cx="600" cy="800" r="5" fill="#34d399" />
    </g>
    
    <!-- 数据流2 -->
    <g transform="translate(1100, 100)" filter="url(#glow)">
      <path d="M0,0 L400,0 L400,200 L200,200 L200,400 L700,400 L700,600" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-dasharray="20,10" />
      <circle cx="0" cy="0" r="5" fill="#34d399" />
      <circle cx="400" cy="0" r="5" fill="#34d399" />
      <circle cx="400" cy="200" r="5" fill="#34d399" />
      <circle cx="200" cy="200" r="5" fill="#34d399" />
      <circle cx="200" cy="400" r="5" fill="#34d399" />
      <circle cx="700" cy="400" r="5" fill="#34d399" />
      <circle cx="700" cy="600" r="5" fill="#34d399" />
    </g>
  </g>
  
  <!-- 中央数据处理元素 -->
  <g transform="translate(960, 540)" filter="url(#glow)">
    <rect x="-120" y="-120" width="240" height="240" fill="none" stroke="#22c55e" stroke-width="3" rx="20" />
    
    <!-- 数据网格 -->
    <g stroke="#6ee7b7" stroke-width="1" opacity="0.5">
      <path d="M-100,-100 H100" />
      <path d="M-100,-60 H100" />
      <path d="M-100,-20 H100" />
      <path d="M-100,20 H100" />
      <path d="M-100,60 H100" />
      <path d="M-100,100 H100" />
      
      <path d="M-100,-100 V100" />
      <path d="M-60,-100 V100" />
      <path d="M-20,-100 V100" />
      <path d="M20,-100 V100" />
      <path d="M60,-100 V100" />
      <path d="M100,-100 V100" />
    </g>
    
    <!-- 数据处理符号 -->
    <g fill="#6ee7b7">
      <!-- 数据块 -->
      <rect x="-80" y="-80" width="160" height="30" rx="5" opacity="0.8" />
      <rect x="-80" y="-40" width="160" height="30" rx="5" opacity="0.8" />
      <rect x="-80" y="0" width="160" height="30" rx="5" opacity="0.8" />
      <rect x="-80" y="40" width="160" height="30" rx="5" opacity="0.8" />
      <rect x="-80" y="80" width="160" height="30" rx="5" opacity="0.8" />
      
      <!-- 数据流指示器 -->
      <path d="M-110,-65 L-80,-65 L-80,-50 L-110,-65" fill="#10b981" />
      <path d="M-110,-25 L-80,-25 L-80,-10 L-110,-25" fill="#10b981" />
      <path d="M-110,15 L-80,15 L-80,30 L-110,15" fill="#10b981" />
      <path d="M-110,55 L-80,55 L-80,70 L-110,55" fill="#10b981" />
    </g>
  </g>
</svg>